<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>去趣 eSIM · 首頁</title>
  <!-- Tailwind Play CDN（只用來在瀏覽器直接預覽）。併進專案時改用專案自己的 Tailwind，主題色見 README.md。 -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { DEFAULT: "#1c202b", 2: "rgb(28 32 43 / 0.72)", 3: "rgb(28 32 43 / 0.5)" },
            brand: { DEFAULT: "#089cf7", ink: "#0577c2", soft: "#e7f4fe" },
            accent: { DEFAULT: "#f5a623", ink: "#b9740a", soft: "#fff4e2" },
            surface: "#f2f4f8",
            canvas: "#f6f8fb",
            card: "#ffffff",
            line: "#e7ecf3",
            good: { DEFAULT: "#17b26a", soft: "#e4f7ee" },
          },
          boxShadow: {
            "card-sm": "0 1px 2px rgba(28, 32, 43, 0.06)",
            card: "0 12px 30px rgba(28, 32, 43, 0.1)",
            "card-lg": "0 18px 44px rgba(8, 156, 247, 0.18)",
          },
          fontFamily: {
            sans: ["Inter", '"Noto Sans TC"', '"SF Pro Display"', '"Microsoft JhengHei"', "-apple-system", "sans-serif"],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-canvas font-sans text-ink antialiased">
  <div class="relative mx-auto flex min-h-dvh max-w-[480px] flex-col bg-card">
    <!-- 示意資料標籤：固定在畫面右上角 -->
    <div class="pointer-events-none sticky top-0 z-40 h-0">
      <span class="absolute right-2 top-2 rounded-full border border-line bg-white/85 px-[7px] py-0.5 text-[10px] font-bold text-ink-3">示意資料</span>
    </div>

    <main class="flex-1 pb-6">
      <!-- 頂部：Demo 時間切換＋通知鈴 -->
      <header class="flex items-center justify-between px-4 pt-2.5">
        <label class="inline-flex items-center gap-0.5 text-[11px] text-ink-3 opacity-[0.55]" title="Demo 時間切換">
          <span aria-hidden="true">⏱</span>
          <select class="cursor-pointer border-none bg-transparent py-0.5 text-[11px] text-[inherit]">
            <option selected>排完行程</option>
            <option>出發前 14 天</option>
            <option>出發前 7 天</option>
            <option>出發前 3 天</option>
            <option>出發前一晚</option>
            <option>旅中</option>
            <option>回國後</option>
          </select>
        </label>
        <button class="relative p-1.5 text-[20px]" aria-label="通知">
          🔔<span class="absolute right-[5px] top-1.5 h-2 w-2 rounded-full border-[1.5px] border-card bg-[#f04438]"></span>
        </button>
      </header>

      <h1 class="mx-5 mb-4 mt-1 text-[26px] font-black leading-[1.35] tracking-[-0.3px]">
        輕鬆規劃旅行<br />從去趣開始！
      </h1>

      <!-- 捷徑格：兩頁，左右滑動 -->
      <div class="flex snap-x snap-mandatory overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        <div class="grid flex-[0_0_100%] snap-start auto-rows-[78px] grid-cols-4 content-start gap-2 px-4">
          <button class="relative col-span-2 flex flex-col items-start justify-end rounded-[14px] bg-gradient-to-br from-[#ffb547] to-[#f5862a] px-3.5 py-3">
            <span class="absolute right-3 top-2.5 text-[28px] leading-none">💡</span>
            <span class="text-[15px] font-black text-white">行程靈感 ›</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">✈️</span>
            <span class="text-[12.5px] font-bold">機票</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🛏️</span>
            <span class="text-[12.5px] font-bold">住宿</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🛡️</span>
            <span class="text-[12.5px] font-bold">旅平險</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🎟️</span>
            <span class="text-[12.5px] font-bold">優惠券</span>
          </button>
          <!-- eSIM 捷徑：藍框＋「依行程推薦」標籤 -->
          <button class="relative flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-brand-soft shadow-[inset_0_0_0_1.5px_#089cf7]">
            <span class="absolute -top-[7px] left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-brand px-1.5 py-0.5 text-[9.5px] font-extrabold text-white">依行程推薦</span>
            <span class="text-2xl leading-none">📶</span>
            <span class="text-[12.5px] font-bold">eSIM</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🎡</span>
            <span class="text-[12.5px] font-bold">旅遊體驗</span>
          </button>
        </div>
        <div class="grid flex-[0_0_100%] snap-start auto-rows-[78px] grid-cols-4 content-start gap-2 px-4">
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🚄</span>
            <span class="text-[12.5px] font-bold">交通</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🛍️</span>
            <span class="text-[12.5px] font-bold">免稅購物</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">#️⃣</span>
            <span class="text-[12.5px] font-bold">主題旅遊</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1.5 rounded-[14px] bg-surface">
            <span class="text-2xl leading-none">🧢</span>
            <span class="text-[12.5px] font-bold">去趣周邊</span>
          </button>
        </div>
      </div>
      <!-- 頁碼點：靜態顯示第 1 頁 -->
      <div class="mb-1 mt-2.5 flex justify-center gap-[5px]">
        <i class="h-1.5 w-4 rounded-[3px] bg-ink"></i>
        <i class="h-1.5 w-1.5 rounded-[3px] bg-[#d5dbe4]"></i>
      </div>

      <!-- 狀態卡：「排完行程、還沒買」時間點的內容 -->
      <div class="mx-4 mt-3 flex items-center gap-2.5 rounded-xl bg-[#fff3e6] py-2.5 pl-3 pr-2">
        <span class="flex-none text-[20px]">📶</span>
        <span class="flex min-w-0 flex-1 flex-col gap-0.5">
          <b class="text-[13px] font-extrabold">AI 算好這趟 4 人的網路</b>
          <small class="text-[11.5px] text-ink-2">依每日行程，每個人各配一張</small>
        </span>
        <button class="flex-none rounded-full bg-[#f5862a] px-3 py-1.5 text-[12.5px] font-extrabold text-white">看方案</button>
        <button class="flex-none px-1 text-[18px] text-ink-3" aria-label="關閉">×</button>
      </div>

      <!-- 開始我的旅行計劃 -->
      <section class="mx-4 mt-5 flex items-center gap-2.5">
        <div class="min-w-0 flex-1">
          <h2 class="m-0 text-lg font-black">開始我的旅行計劃</h2>
          <p class="mb-3 mt-1.5 text-[13px] text-ink-2">AI 幫你排行程，網路也幫你算</p>
          <button class="rounded-full bg-ink px-4 py-[9px] text-[13px] font-extrabold text-white">馬上來玩 ›</button>
        </div>
        <div class="relative h-[116px] w-[132px] flex-none">
          <span class="absolute left-0 top-0 h-[74px] w-[74px] -rotate-6 rounded-xl border-2 border-card bg-cover bg-center shadow-card-sm" style="background-image: url(https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=240&h=240&fit=crop&q=70&auto=format)"></span>
          <span class="absolute right-0 top-1.5 h-16 w-16 rotate-[5deg] rounded-xl border-2 border-card bg-cover bg-center shadow-card-sm" style="background-image: url(https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=240&h=240&fit=crop&q=70&auto=format)"></span>
          <span class="absolute bottom-0 left-9 h-14 w-[66px] rounded-xl border-2 border-card bg-cover bg-center shadow-card-sm" style="background-image: url(https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=240&h=240&fit=crop&q=70&auto=format)"></span>
        </div>
      </section>

      <!-- 星榜單：東京「景點」前 5 名 -->
      <section class="mt-[26px]">
        <h2 class="mx-4 text-lg font-black">星榜單</h2>
        <div class="mx-4 mb-3 mt-2.5 flex gap-2">
          <button class="inline-flex items-center gap-1.5 rounded-full border border-[#d5dbe4] bg-card px-3 py-1.5 text-[13px] font-bold">
            日本 東京都 <span class="text-xs text-ink-3">⌄</span>
          </button>
          <label class="inline-flex items-center gap-1.5 rounded-full border border-[#d5dbe4] bg-card px-3 py-1.5 text-[13px] font-bold">
            <select class="cursor-pointer appearance-none border-none bg-transparent p-0 text-[13px] font-bold text-ink">
              <option selected>景點</option>
              <option>美食</option>
              <option>購物</option>
            </select>
            <span class="text-xs text-ink-3">⌄</span>
          </label>
        </div>
        <div class="flex gap-2.5 overflow-x-auto px-4 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          <div class="relative flex h-[200px] flex-[0_0_150px] flex-col justify-end overflow-hidden rounded-[14px] bg-cover bg-center p-2.5 text-white" style="background-image: url(https://images.unsplash.com/photo-1480796927426-f609979314bd?w=480&h=600&fit=crop&q=70&auto=format)">
            <span class="absolute inset-0 bg-gradient-to-b from-transparent from-40% to-black/70"></span>
            <span class="absolute left-2 top-2 z-[1] rounded-md bg-[#ffd23f] px-1.5 py-0.5 text-[10.5px] font-black text-ink">TOP 01</span>
            <button class="absolute right-1.5 top-1.5 z-[1] h-[30px] w-[30px] rounded-full bg-black/30 text-base leading-none text-white" aria-label="收藏">♡</button>
            <span class="relative text-[13.5px] font-extrabold leading-[1.35]">淺草寺・雷門散策</span>
            <span class="relative mt-[3px] text-[11px] opacity-[0.85]">★ 4.6 · ♡ 3,241</span>
          </div>
          <div class="relative flex h-[200px] flex-[0_0_150px] flex-col justify-end overflow-hidden rounded-[14px] bg-cover bg-center p-2.5 text-white" style="background-image: url(https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=480&h=720&fit=crop&q=70&auto=format)">
            <span class="absolute inset-0 bg-gradient-to-b from-transparent from-40% to-black/70"></span>
            <span class="absolute left-2 top-2 z-[1] rounded-md bg-[#ffd23f] px-1.5 py-0.5 text-[10.5px] font-black text-ink">TOP 02</span>
            <button class="absolute right-1.5 top-1.5 z-[1] h-[30px] w-[30px] rounded-full bg-black/30 text-base leading-none text-white" aria-label="收藏">♡</button>
            <span class="relative text-[13.5px] font-extrabold leading-[1.35]">teamLab Planets 沉浸式光影展</span>
            <span class="relative mt-[3px] text-[11px] opacity-[0.85]">★ 4.7 · ♡ 2,876</span>
          </div>
          <div class="relative flex h-[200px] flex-[0_0_150px] flex-col justify-end overflow-hidden rounded-[14px] bg-cover bg-center p-2.5 text-white" style="background-image: url(https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=480&h=720&fit=crop&q=70&auto=format)">
            <span class="absolute inset-0 bg-gradient-to-b from-transparent from-40% to-black/70"></span>
            <span class="absolute left-2 top-2 z-[1] rounded-md bg-[#ffd23f] px-1.5 py-0.5 text-[10.5px] font-black text-ink">TOP 03</span>
            <button class="absolute right-1.5 top-1.5 z-[1] h-[30px] w-[30px] rounded-full bg-black/30 text-base leading-none text-white" aria-label="收藏">♡</button>
            <span class="relative text-[13.5px] font-extrabold leading-[1.35]">SHIBUYA SKY 頂樓夜景</span>
            <span class="relative mt-[3px] text-[11px] opacity-[0.85]">★ 4.7 · ♡ 2,265</span>
          </div>
          <div class="relative flex h-[200px] flex-[0_0_150px] flex-col justify-end overflow-hidden rounded-[14px] bg-cover bg-center p-2.5 text-white" style="background-image: url(https://images.unsplash.com/photo-1604928141064-207cea6f571f?w=480&h=720&fit=crop&q=70&auto=format)">
            <span class="absolute inset-0 bg-gradient-to-b from-transparent from-40% to-black/70"></span>
            <span class="absolute left-2 top-2 z-[1] rounded-md bg-[#ffd23f] px-1.5 py-0.5 text-[10.5px] font-black text-ink">TOP 04</span>
            <button class="absolute right-1.5 top-1.5 z-[1] h-[30px] w-[30px] rounded-full bg-black/30 text-base leading-none text-white" aria-label="收藏">♡</button>
            <span class="relative text-[13.5px] font-extrabold leading-[1.35]">東京鐵塔 夜間點燈</span>
            <span class="relative mt-[3px] text-[11px] opacity-[0.85]">★ 4.5 · ♡ 1,690</span>
          </div>
          <div class="relative flex h-[200px] flex-[0_0_150px] flex-col justify-end overflow-hidden rounded-[14px] bg-cover bg-center p-2.5 text-white" style="background-image: url(https://images.unsplash.com/photo-1601823984263-b87b59798b70?w=480&h=720&fit=crop&q=70&auto=format)">
            <span class="absolute inset-0 bg-gradient-to-b from-transparent from-40% to-black/70"></span>
            <span class="absolute left-2 top-2 z-[1] rounded-md bg-[#ffd23f] px-1.5 py-0.5 text-[10.5px] font-black text-ink">TOP 05</span>
            <button class="absolute right-1.5 top-1.5 z-[1] h-[30px] w-[30px] rounded-full bg-black/30 text-base leading-none text-white" aria-label="收藏">♡</button>
            <span class="relative text-[13.5px] font-extrabold leading-[1.35]">明治神宮 森林參道</span>
            <span class="relative mt-[3px] text-[11px] opacity-[0.85]">★ 4.6 · ♡ 1,418</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部分頁列（四頁共用）：目前在「首頁」 -->
    <nav class="sticky bottom-0 z-30 flex border-t border-line bg-card pb-[calc(4px+env(safe-area-inset-bottom))]">
      <a href="home.html" class="flex flex-1 flex-col items-center gap-[3px] pb-[7px] pt-[9px] text-brand-ink">
        <span class="-translate-y-px text-[20px] leading-none">🏠</span>
        <span class="text-[10.5px] font-bold">首頁</span>
      </a>
      <a href="explore.html" class="flex flex-1 flex-col items-center gap-[3px] pb-[7px] pt-[9px] text-ink-3">
        <span class="text-[20px] leading-none opacity-60 grayscale-[0.6]">🧭</span>
        <span class="text-[10.5px] font-bold">探索</span>
      </a>
      <a href="#trip" class="flex flex-1 flex-col items-center gap-[3px] pb-[7px] pt-[9px] text-ink-3">
        <span class="text-[20px] leading-none opacity-60 grayscale-[0.6]">🗺️</span>
        <span class="text-[10.5px] font-bold">行程</span>
      </a>
      <a href="me.html" class="flex flex-1 flex-col items-center gap-[3px] pb-[7px] pt-[9px] text-ink-3">
        <span class="text-[20px] leading-none opacity-60 grayscale-[0.6]">👤</span>
        <span class="text-[10.5px] font-bold">會員</span>
      </a>
    </nav>
  </div>
</body>
</html>
